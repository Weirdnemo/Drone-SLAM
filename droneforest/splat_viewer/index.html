<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lidar drone in a Gaussian splat</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e14; overflow: hidden; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #cfe3f5; }
  canvas { display: block; }
  .card { position: fixed; background: rgba(8,12,18,.72); border-radius: 4px; backdrop-filter: blur(3px); }
  #panel { left: 12px; top: 12px; padding: 5px 10px; pointer-events: none; }
  #panel b { color: #fff; } #panel .ttl { color: #59e0ff; letter-spacing: .08em; font-size: 11px; }
  #heat { left: 12px; bottom: 12px; cursor: crosshair; }
  #pick { left: 12px; bottom: 318px; width: 300px; padding: 4px 8px; box-sizing: border-box; color: #bfe9ff; user-select: all; font-size: 11px; display: none; }
  #range { right: 12px; bottom: 12px; width: 380px; height: 100px; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 14px; }
  #rec { position: fixed; right: 14px; top: 14px; display: none; color: #ff5a6e; font-weight: bold; pointer-events: none; }
  .lil-gui.root { --background-color: rgba(10,14,20,.88); --widget-color: #1d2a3a; --hover-color: #25354a; --number-color: #5aa9ff; --string-color: #8fd3a8; --font-size: 12px; }
</style>
<script type="importmap">{ "imports": { "three": "../viewer/vendor/three.module.js" } }</script>
</head><body>
<div id="msg">loading splat…</div><div id="rec">● REC</div>
<div id="panel" class="card"></div><canvas id="heat" class="card" width="600" height="600"></canvas><div id="pick" class="card"></div><canvas id="range" class="card" width="760" height="200"></canvas>
<script type="module" src="./main.js"></script>
</body></html>
